# Public status page for RunAnywhere / Wally: https://status.runanywhere.ai
# Plan and reasoning: RunanywhereAI/InferenceInfra#930.
owner: RunanywhereAI
repo: status

sites:
  # /v1/models is public now (answers 200 without a key), so the API row
  # probes a keyless chat completion instead: 401 proves the edge, the
  # gateway and key auth are alive end to end, and costs nothing. A 5xx is
  # down. Don't change it to expect 200: the 401 is the proof.
  - name: Inference API
    url: https://inference.runanywhere.ai/v1/chat/completions
    method: POST
    body: '{"model":"glm-5.3-flash","messages":[{"role":"user","content":"ping"}]}'
    headers:
      - "Content-Type: application/json"
    expectedStatusCodes:
      - 401
    maxResponseTime: 5000
  - name: Model catalog
    url: https://inference.runanywhere.ai/v1/models
    maxResponseTime: 5000
  - name: Control plane
    url: https://inference.runanywhere.ai/api/readyz
    maxResponseTime: 5000
  - name: Console
    url: https://console.runanywhere.ai/
    maxResponseTime: 5000
  - name: Website
    url: https://runanywhere.ai/
    maxResponseTime: 5000

status-website:
  cname: status.runanywhere.ai
  name: RunAnywhere Status
  introTitle: "**RunAnywhere** service status"
  introMessage: Live status of the Wally inference API, control plane and console. Incidents are posted here as they happen.
  logoUrl: https://runanywhere.ai/favicon.ico
  navbar:
    - title: Status
      href: /
    - title: Wally
      href: https://www.runwally.com
    - title: Support
      href: mailto:support@runanywhere.ai
